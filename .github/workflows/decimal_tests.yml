name: Tower decimal tests

on:
  workflow_dispatch:
  pull_request:
    paths: &decimal_paths
      - 'scaffolding/library/float_bits.tower'
      - 'scaffolding/library/float_text*.tower'
      - 'scaffolding/tests/decimal_round_trips*.tower'
      - 'scaffolding/tests/float_text.tower'
      - 'cmake/TowerLanguageTest*'
      - '.github/workflows/decimal_tests.yml'
  push:
    branches: [main]
    paths: *decimal_paths

permissions:
  contents: read

jobs:
  decimal:
    runs-on: ubuntu-24.04
    env:
      TOWER_NATIVE_BUILD: /tmp/tower_decimal
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang-19 llvm-19-dev lld-19 ninja-build
      - run: bash playground/scripts/build-native.sh -DTOWER_DRIVER_TESTS=ON
      - run: cmake --build "$TOWER_NATIVE_BUILD" --target tower-selected-test-count tower-guest-native-test --parallel 2
      - name: Run the five library groups
        run: ctest --test-dir "$TOWER_NATIVE_BUILD" --no-tests=error --output-on-failure -R '^tower-selected-float-text(-direct)?-jobs-[14]$'
      - name: Run the full generated stream
        run: ctest --test-dir "$TOWER_NATIVE_BUILD" --no-tests=error --output-on-failure -R '^tower-selected-float-text-round-trips(-direct)?-jobs-[14]$'
